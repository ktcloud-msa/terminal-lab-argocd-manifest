cert-manager:
  # Let cert-manager manage its own CRDs so the ClusterIssuer/Certificate kinds
  # exist before platform/41-cluster-issuer (sync-wave 2) is applied.
  crds:
    enabled: true
    keep: true

  # The ACME HTTP-01 solver needs to reach the public IP; nothing special here,
  # but pin modest resources for the three components.
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

  webhook:
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 128Mi

  cainjector:
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi
