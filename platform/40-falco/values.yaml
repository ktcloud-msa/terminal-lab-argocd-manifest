falco:
  driver:
    kind: modern_ebpf

  falco:
    json_output: true
    # Tag-driven output so Talon can match on the rule tags below.
    json_include_output_property: true

  collectors:
    kubernetes:
      enabled: true

  resources:
    requests:
      cpu: 100m
      memory: 256Mi

  # ---------------------------------------------------------------------------
  # Falcosidekick — forward every Falco event to Falco Talon, which decides the
  # response (pod labeling + network isolation). See platform/40-falco-talon.
  # ---------------------------------------------------------------------------
  falcosidekick:
    enabled: true
    config:
      # Only ship notice+ to keep Talon focused on actionable events.
      webhook:
        address: "http://falco-talon:2803"
        minimumpriority: notice

  # ---------------------------------------------------------------------------
  # Custom rules — two threat classes the platform must catch at runtime.
  # The tags (crypto_mining / persistence) are what Talon's rules key off of.
  # ---------------------------------------------------------------------------
  customRules:
    rules-terminal-lab.yaml: |-
      # --- Crypto-mining -----------------------------------------------------
      - macro: known_miner_procs
        condition: >
          (proc.name in (xmrig, minerd, minergate, cpuminer, ethminer,
           cgminer, bfgminer, nbminer, t-rex, phoenixminer, lolminer, nanominer,
           xmr-stak, ccminer))

      - macro: miner_cmdline_hints
        condition: >
          (proc.cmdline contains "stratum+tcp" or proc.cmdline contains "stratum+ssl"
           or proc.cmdline contains "--donate-level" or proc.cmdline contains "nicehash"
           or proc.cmdline contains "minexmr" or proc.cmdline contains "xmrpool")

      - rule: Crypto Miner Launched in Container
        desc: >
          A known cryptominer binary or a process with mining-pool (stratum)
          command-line markers was executed inside a container.
        condition: >
          spawned_process and container
          and (known_miner_procs or miner_cmdline_hints)
        output: >
          Crypto miner activity in container
          (user=%user.name command=%proc.cmdline proc=%proc.name
           container=%container.name image=%container.image.repository:%container.image.tag
           pod=%k8s.pod.name ns=%k8s.ns.name)
        priority: CRITICAL
        tags: [container, mitre_execution, mitre_impact, crypto_mining]

      # --- Persistence -------------------------------------------------------
      - macro: persistence_paths
        condition: >
          (fd.name startswith /etc/cron or
           fd.name startswith /var/spool/cron or
           fd.name startswith /etc/systemd/system or
           fd.name = /etc/ld.so.preload or
           fd.name endswith /.ssh/authorized_keys or
           fd.name startswith /etc/init.d or
           fd.name = /etc/rc.local)

      - rule: Persistence Mechanism Written in Container
        desc: >
          A process inside a container wrote to a cron, systemd, init, SSH
          authorized_keys, or loader-preload path — classic persistence.
        condition: >
          open_write and container and persistence_paths
        output: >
          Persistence path written in container
          (user=%user.name file=%fd.name proc=%proc.name cmdline=%proc.cmdline
           container=%container.name image=%container.image.repository
           pod=%k8s.pod.name ns=%k8s.ns.name)
        priority: CRITICAL
        tags: [container, mitre_persistence, persistence]
