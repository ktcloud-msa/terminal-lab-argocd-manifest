gatekeeper:
  replicas: 1

  auditInterval: 60

  constraintViolationsLimit: 20

  # Small footprint for a dev/staging cluster. Chart defaults cover limits; only
  # requests are pinned here.
  controllerManager:
    resources:
      requests:
        cpu: 100m
        memory: 256Mi

  audit:
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
