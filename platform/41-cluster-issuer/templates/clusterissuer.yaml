apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
  annotations:
    # Wave 2 — needs the cert-manager CRDs (ClusterIssuer kind) from wave 1.
    argocd.argoproj.io/sync-wave: "2"
spec:
  acme:
    server: {{ .Values.acme.server }}
    email: {{ .Values.acme.email }}
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: {{ .Values.acme.ingressClass }}
