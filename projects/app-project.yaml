apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: app
  namespace: argocd
  # Application layer: the terminal-lab web + api workloads rendered by the
  # bootstrap/applications.yaml ApplicationSet.
spec:
  description: terminal-lab application workloads (web + api)
  sourceRepos:
    - '*'
  destinations:
    - server: '*'
      namespace: '*'
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
