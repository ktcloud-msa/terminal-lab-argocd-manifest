apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .Release.Name }}-tls
  namespace: {{ .Release.Namespace }}
spec:
  secretName: {{ .Values.tlsSecretName }}
  # Same namespace as the IngressRoute below so Traefik can load the secret.
  dnsNames:
    - {{ .Values.host }}
  issuerRef:
    name: {{ .Values.clusterIssuer }}
    kind: ClusterIssuer
