---
# Redirect plain HTTP → HTTPS. The ACME HTTP-01 challenge is served by a
# separate cert-manager-managed Ingress (class traefik), which is NOT subject
# to this per-route middleware, so certificate issuance still works on :80.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ .Release.Name }}-redirect-https
  namespace: {{ .Release.Namespace }}
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ .Release.Name }}-http
  namespace: {{ .Release.Namespace }}
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`{{ .Values.host }}`)
      kind: Rule
      middlewares:
        - name: {{ .Release.Name }}-redirect-https
          namespace: {{ .Release.Namespace }}
      services:
        - name: {{ .Release.Name }}
          port: {{ .Values.service.port | default 80 }}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ .Release.Name }}-https
  namespace: {{ .Release.Namespace }}
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`{{ .Values.host }}`)
      kind: Rule
      services:
        - name: {{ .Release.Name }}
          port: {{ .Values.service.port | default 80 }}
  tls:
    secretName: {{ .Values.tlsSecretName }}
